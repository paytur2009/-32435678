<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Особливе питання ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
      padding: 20px;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      max-width: 450px;
      width: 100%;
      position: relative;
    }

    h1 {
      color: #333;
      margin-bottom: 25px;
      font-size: 24px;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
      min-height: 80px;
      position: relative;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #btnYes {
      background-color: #2ed573;
      color: white;
      z-index: 2;
    }

    #btnNo {
      background-color: #ff4757;
      color: white;
      position: relative;
      transition: top 0.2s, left 0.2s, font-size 0.2s;
    }

    #result {
      margin-top: 25px;
      font-size: 20px;
      font-weight: bold;
      color: #2ed573;
    }

    /* Модальне вікно */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 15px;
      max-width: 350px;
      width: 90%;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .modal-content h3 {
      color: #ff4757;
      margin-bottom: 10px;
    }

    .modal-content p {
      color: #555;
      margin-bottom: 8px;
    }

    .modal-content .sub-text {
      font-size: 14px;
      color: #888;
      margin-bottom: 20px;
    }

    .modal-content button {
      background-color: #70a1ff;
      color: white;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="questionText">У мене є до тебе важливе питання... ✨</h1>

    <div class="btn-container">
      <button id="btnYes" onclick="sayYes()">Так!</button>
      <button id="btnNo" onclick="sayNo()" onmouseover="moveButton()" ontouchstart="moveButton()">Ні</button>
    </div>

    <div id="result"></div>
  </div>

  <!-- Модальне вікно після 5 відмов -->
  <div id="errorModal" class="modal">
    <div class="modal-content">
      <h3>Погано, що ми не будемо разом... 💔</h3>
      <p>Ну ладно, бувай... 👋</p>
      <p class="sub-text">Але ти завжди можеш перезайти на сайт і обрати "Так!", красотка! 😉</p>
      <button onclick="closeModal()">Закрити</button>
    </div>
  </div>

  <script>
    let noClickCount = 0; // Лічильник натискань на "Ні"

    const noTexts = [
      "Ну давай так 🥺",
      "Ну будь ласка, так! 🙏",
      "Ну благаю, так! ❤️",
      "Ну давай так, а не ні! ✨",
      "Я з тобою дуже хочу! 🔥"
    ];

    // Функція втікання кнопки "Ні"
    function moveButton() {
      const btnNo = document.getElementById("btnNo");
      const x = Math.random() * (window.innerWidth - btnNo.offsetWidth - 40) - (window.innerWidth / 2 - 100);
      const y = Math.random() * (window.innerHeight - btnNo.offsetHeight - 40) - (window.innerHeight / 2 - 100);
      
      btnNo.style.position = "absolute";
      btnNo.style.left = `${Math.max(-100, Math.min(100, x))}px`;
      btnNo.style.top = `${Math.max(-100, Math.min(100, y))}px`;
    }

    // Реакція на натискання "Ні"
    function sayNo() {
      noClickCount++;

      // Оновлюємо текст на кнопці "Ні"
      if (noClickCount <= noTexts.length) {
        document.getElementById("btnNo").innerText = noTexts[noClickCount - 1];
      }

      // Збільшуємо кнопку "Так"
      const btnYes = document.getElementById("btnYes");
      const currentSize = parseFloat(window.getComputedStyle(btnYes).fontSize);
      btnYes.style.fontSize = `${currentSize + 5}px`;

      // На 5-ту спробу відкриваємо вікно та надсилаємо сповіщення
      if (noClickCount >= 5) {
        showErrorModal();
      }
    }

    // Відкриття модального вікна та відправка на пошту
    function showErrorModal() {
      document.getElementById("errorModal").style.display = "flex";
      
      fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          access_key: "0a86cff4-07f0-4945-807a-b4610e623788",
          subject: "Результат: Вона відмовилась ❌",
          message: `Вона натиснула "Ні" ${noClickCount} разів і взагалі не захотіла обирати "Так".`
        })
      });
    }

    function closeModal() {
      document.getElementById("errorModal").style.display = "none";
    }

    // Реакція на натискання "Так"
    function sayYes() {
      const resultText = document.getElementById("result");
      const btnContainer = document.querySelector(".btn-container");
      
      resultText.innerHTML = "Молодець, що погодилась! Я тобі скоро напишу 😉✨";
      btnContainer.style.display = "none"; // Ховаємо кнопки після згоди
      
      let attemptMessage = "";
      if (noClickCount === 0) {
        attemptMessage = "Вона одразу вибрала 'Так'! 🚀";
      } else {
        attemptMessage = `Вона вибрала 'Так' з ${noClickCount + 1}-ї спроби! 😉 (натиснула 'Ні' ${noClickCount} разів)`;
      }

      fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          access_key: "0a86cff4-07f0-4945-807a-b4610e623788",
          subject: "Результат: Вона відповіла ТАК! 🎉",
          message: attemptMessage
        })
      });
    }
  </script>
</body>
</html>
