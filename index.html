<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запрошення на Вальс 🕺</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        :root {
            --glow-x: 50%;
            --glow-y: 50%;
        }

        body {
            font-family: 'Comfortaa', cursive, sans-serif;
            background: radial-gradient(circle at var(--glow-x) var(--glow-y), #2e1065 0%, #0f172a 70%, #020617 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
            position: relative;
            color: #ffffff;
            perspective: 1000px;
        }

        .sparkles-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .floating-sparkle {
            position: absolute;
            bottom: -50px;
            color: rgba(168, 85, 247, 0.5);
            filter: blur(0.5px) drop-shadow(0 0 10px rgba(168, 85, 247, 0.7));
            animation: floatUp 6s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            20% { opacity: 0.9; }
            80% { opacity: 0.4; }
            100% {
                transform: translateY(-115vh) rotate(360deg) scale(1.3);
                opacity: 0;
            }
        }

        .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: clamp(30px, 5vw, 55px) clamp(20px, 4vw, 35px);
            border-radius: 45px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.75),
                        inset 0 1px 0 rgba(255,255,255,0.3),
                        0 0 50px rgba(168, 85, 247, 0.15);
            max-width: 500px;
            width: 92%;
            z-index: 2;
            transform-style: preserve-3d;
            transition: transform 0.5s ease, box-shadow 0.5s ease, border-color 0.5s ease;
        }

        .card-content {
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        h1 {
            font-size: clamp(22px, 5vw, 28px);
            line-height: 1.5;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 20%, #c084fc 60%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 15px rgba(0,0,0,0.5));
        }

        .auth-form {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .auth-form input {
            width: 100%;
            padding: 16px 22px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 16px;
            font-family: 'Comfortaa', cursive, sans-serif;
            outline: none;
            backdrop-filter: blur(10px);
            transition: border-color 0.3s, box-shadow 0.3s;
            user-select: auto;
            -webkit-user-select: auto;
        }

        .auth-form input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .auth-form input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .auth-btn {
            background: linear-gradient(135deg, #ffd700, #f59e0b);
            color: #0f172a;
            padding: 16px;
            border-radius: 50px;
            border: none;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Comfortaa', cursive, sans-serif;
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 215, 0, 0.6);
        }

        .buttons-sandbox {
            position: relative;
            width: 100%;
            height: 380px;
            margin-top: 25px;
        }

        button.option-btn {
            padding: 16px 42px;
            font-size: 19px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Comfortaa', cursive, sans-serif;
            position: absolute;
            white-space: nowrap;
            outline: none;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
            transition: left 0.2s cubic-bezier(0.25, 0.8, 0.25, 1), 
                        top 0.2s cubic-bezier(0.25, 0.8, 0.25, 1), 
                        transform 0.2s ease-out;
        }

        #yesBtn {
            background: linear-gradient(135deg, #ffd700, #f59e0b);
            color: #0f172a;
            z-index: 10;
        }

        #yesBtn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50px;
            box-shadow: 0 0 25px #ffd700;
            opacity: 0;
            transition: opacity 0.3s ease;
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.25); opacity: 0; }
        }

        #noBtn {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.35);
            z-index: 5;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: linear-gradient(135deg, #1e1b4b, #0f172a);
            border: 1px solid rgba(168, 85, 247, 0.4);
            padding: 45px;
            border-radius: 40px;
            max-width: 460px;
            width: 88%;
            box-shadow: 0 40px 80px rgba(0,0,0,0.9), 0 0 40px rgba(168,85,247,0.2);
            transform: scale(0.85);
            animation: modalPop 0.5s cubic-bezier(0.34, 1.7, 0.64, 1) forwards;
        }
        @keyframes modalPop { to { transform: scale(1); } }
        .modal-content h3 { color: #ffd700; margin-bottom: 15px; font-size: 26px; font-weight: 700; letter-spacing: 0.5px; }
        .modal-content p { line-height: 1.6; color: #cbd5e1; font-size: 16px; }
        .modal-content button { 
            background: #ffd700; color: #0f172a; padding: 15px 40px; font-size: 17px; 
            margin-top: 30px; border-radius: 50px; border: none; font-weight: 700;
            cursor: pointer; box-shadow: 0 10px 25px rgba(255, 215, 0, 0.5);
            font-family: 'Comfortaa', cursive, sans-serif;
        }

        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: inline-block;
            filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.8));
            animation: floatAnimation 2s ease-in-out infinite;
        }
        @keyframes floatAnimation {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
    </style>
</head>
<body>

    <div class="sparkles-bg" id="sparklesBg"></div>

    <div class="card" id="mainCard">
        <div class="card-content" id="cardContent">
            
            <!-- КРОК 1: Форма входу -->
            <div id="stepAuth">
                <h1>Привіт! 👋<br>Введи свої дані для входу</h1>
                <form class="auth-form" onsubmit="startSurvey(event)">
                    <input type="text" id="userName" placeholder="Твоє ім'я" required>
                    <input type="text" id="userTg" placeholder="Твій Telegram (@username)" required>
                    <button type="submit" class="auth-btn">Продовжити 🚀</button>
                </form>
            </div>

            <!-- КРОК 2: Питання та кнопки -->
            <div id="stepQuestion" style="display: none;">
                <h1 id="question">Ти підеш зі мною вальс танцювати? 🕺✨</h1>
                
                <div class="buttons-sandbox" id="sandbox">
                    <button class="option-btn" id="yesBtn" onclick="sayYes()">Так! 🔥</button>
                    <button class="option-btn" id="noBtn" onmouseover="handleEscape(event)" ontouchstart="handleEscape(event)" onclick="hitNo()">Ні</button>
                </div>
            </div>

        </div>
    </div>

    <div class="modal" id="errorModal">
        <div class="modal-content">
            <h3>🤔 Треба подумати ще раз</h3>
            <p>Ця кнопка занадто прудка, та й відмови не приймаються. Давай все ж спробуємо потанцювати? 😉</p>
            <button onclick="closeModal()">Переконав, давай! ✨</button>
        </div>
    </div>

    <script>
        // ВСТАВ СЮДИ СВІЙ ACCESS KEY З WEB3FORMS:
        const WEB3FORMS_KEY = 'e21f5deb-ba67-4522-af38-6e7e2692b9c7'; 

        let userData = {
            name: '',
            tg: ''
        };

        let attempts = 0;
        let noClicks = 0;
        let noScale = 1;
        let yesScale = 1;
        
        let audioCtx = null;
        let ambientOsc = null;
        let ambientGain = null;

        const noPhrases = [
            "Та подумай ще... 🤔",
            "Може спробуємо? ✨",
            "Буде ж круто, ну! 🔥",
            "А якщо добре подумати? 😉",
            "Давай без цього, погнали! 🚀",
            "Здаюся, тисни «Так»! 🙌"
        ];

        function startSurvey(e) {
            e.preventDefault();
            const nameInput = document.getElementById('userName').value.trim();
            const tgInput = document.getElementById('userTg').value.trim();

            if (!nameInput || !tgInput) return;

            userData.name = nameInput;
            userData.tg = tgInput.startsWith('@') ? tgInput : '@' + tgInput;

            document.getElementById('stepAuth').style.display = 'none';
            document.getElementById('stepQuestion').style.display = 'block';

            initPositions();
        }

        function initAudioEngine() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                ambientOsc = audioCtx.createOscillator();
                ambientGain = audioCtx.createGain();
                
                ambientOsc.type = 'triangle';
                ambientOsc.frequency.setValueAtTime(146.83, audioCtx.currentTime); 
                
                ambientGain.gain.setValueAtTime(0, audioCtx.currentTime);
                ambientGain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 2.0);
                
                ambientOsc.connect(ambientGain);
                ambientGain.connect(audioCtx.destination);
                ambientOsc.start();
            }
        }

        function playEscapeSound() {
            initAudioEngine();
            if (!audioCtx) return;

            let time = audioCtx.currentTime;
            let osc1 = audioCtx.createOscillator();
            let osc2 = audioCtx.createOscillator();
            let gainNode = audioCtx.createGain();

            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(350, time);
            osc1.frequency.exponentialRampToValueAtTime(950, time + 0.12);

            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(355, time);
            osc2.frequency.exponentialRampToValueAtTime(960, time + 0.12);

            gainNode.gain.setValueAtTime(0.1, time);
            gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.12);

            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc1.start(time);
            osc2.start(time);
            osc1.stop(time + 0.12);
            osc2.stop(time + 0.12);
        }

        function playSuccessMelody() {
            initAudioEngine(); 
            if (!audioCtx) return;

            if (ambientGain) {
                ambientGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
                setTimeout(() => {
                    if (ambientOsc) {
                        ambientOsc.stop();
                        ambientOsc.disconnect();
                    }
                }, 500);
            }
            
            const melody = [587.33, 739.99, 880.00, 1174.66, 1479.98]; 
            melody.forEach((freq, index) => {
                setTimeout(() => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.8);
                }, index * 75);
            });
        }

        document.addEventListener('mousemove', (e) => {
            const xPercent = (e.clientX / window.innerWidth) * 100;
            const yPercent = (e.clientY / window.innerHeight) * 100;
            document.documentElement.style.setProperty('--glow-x', `${xPercent}%`);
            document.documentElement.style.setProperty('--glow-y', `${yPercent}%`);
        });

        document.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                const xPercent = (e.touches[0].clientX / window.innerWidth) * 100;
                const yPercent = (e.touches[0].clientY / window.innerHeight) * 100;
                document.documentElement.style.setProperty('--glow-x', `${xPercent}%`);
                document.documentElement.style.setProperty('--glow-y', `${yPercent}%`);
            }
        });

        function createBackgroundSparkles() {
            const bg = document.getElementById('sparklesBg');
            setInterval(() => {
                const sparkle = document.createElement('div');
                sparkle.classList.add('floating-sparkle');
                sparkle.innerText = ['⚡', '✦', '🚀', '🎵', '✨'][Math.floor(Math.random() * 5)];
                sparkle.style.left = Math.random() * 100 + 'vw';
                sparkle.style.animationDuration = (Math.random() * 2 + 4) + 's';
                sparkle.style.fontSize = (Math.random() * 14 + 14) + 'px';
                if(Math.random() > 0.5) {
                    sparkle.style.color = 'rgba(56, 189, 248, 0.5)';
                    sparkle.style.filter = 'blur(0.5px) drop-shadow(0 0 10px rgba(56, 189, 248, 0.7))';
                }
                bg.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 6000);
            }, 180);
        }

        function handleEscape(e) {
            noClicks++;
            if (attempts >= noPhrases.length) {
                if (e.type === 'touchstart') {
                    e.preventDefault();
                    hitNo();
                }
                return;
            }
            if (e.type === 'touchstart') {
                e.preventDefault(); 
            }
            moveButton();
        }

        function moveButton() {
            if (attempts >= noPhrases.length) return;

            playEscapeSound();
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            const sandbox = document.getElementById('sandbox');

            if (attempts < noPhrases.length - 1) {
                noBtn.innerText = noPhrases[attempts];

                noScale = Math.max(0.6, noScale - 0.08);
                yesScale = Math.min(2.2, yesScale + 0.15); 

                noBtn.style.transform = `scale(${noScale})`;
                yesBtn.style.transform = `scale(${yesScale})`;

                const noW = noBtn.offsetWidth;
                const noH = noBtn.offsetHeight;
                const visualNoW = noW * noScale;
                const visualNoH = noH * noScale;

                const edgePadding = 15;
                const minUnscaledX = edgePadding - (noW - visualNoW) / 2;
                const maxUnscaledX = sandbox.clientWidth - visualNoW - edgePadding - (noW - visualNoW) / 2;
                const minUnscaledY = edgePadding - (noH - visualNoH) / 2;
                const maxUnscaledY = sandbox.clientHeight - visualNoH - edgePadding - (noH - visualNoH) / 2;

                let rangeX = maxUnscaledX - minUnscaledX;
                let rangeY = maxUnscaledY - minUnscaledY;
                if (rangeX <= 0) rangeX = 10;
                if (rangeY <= 0) rangeY = 10;

                const yesRect = {
                    left: yesBtn.offsetLeft - (yesBtn.offsetWidth * (yesScale - 1) / 2),
                    top: yesBtn.offsetTop - (yesBtn.offsetHeight * (yesScale - 1) / 2),
                    width: yesBtn.offsetWidth * yesScale,
                    height: yesBtn.offsetHeight * yesScale
                };

                let randomX, randomY;
                let isValidPosition = false;
                let safetyCounter = 0;

                while (!isValidPosition && safetyCounter < 200) {
                    randomX = minUnscaledX + Math.random() * rangeX;
                    randomY = minUnscaledY + Math.random() * rangeY;

                    const visualLeft = randomX + (noW - visualNoW) / 2;
                    const visualTop = randomY + (noH - visualNoH) / 2;

                    const overlapX = (visualLeft < yesRect.left + yesRect.width + 15) && (visualLeft + visualNoW > yesRect.left - 15);
                    const overlapY = (visualTop < yesRect.top + yesRect.height + 15) && (visualTop + visualNoH > yesRect.top - 15);

                    if (!overlapX || !overlapY) {
                        isValidPosition = true;
                    }
                    safetyCounter++;
                }

                noBtn.style.left = randomX + 'px';
                noBtn.style.top = randomY + 'px';

                attempts++;
            } else {
                noBtn.innerText = noPhrases[noPhrases.length - 1];
                noBtn.style.transform = 'scale(0.55)';
                yesBtn.style.transform = `scale(${yesScale})`;

                noBtn.style.left = ((sandbox.clientWidth - noBtn.offsetWidth) / 2) + 'px';
                noBtn.style.top = (sandbox.clientHeight - noBtn.offsetHeight - 10) + 'px';
                
                attempts++; 
            }
        }

        function initPositions() {
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const sandbox = document.getElementById('sandbox');

            yesBtn.style.transform = 'scale(1)';
            noBtn.style.transform = 'scale(1)';

            const gap = 20;
            const totalWidth = yesBtn.offsetWidth + gap + noBtn.offsetWidth;

            if (totalWidth < sandbox.clientWidth - 40) {
                const startLeft = (sandbox.clientWidth - totalWidth) / 2;
                const topPos = (sandbox.clientHeight - yesBtn.offsetHeight) / 2;
                
                yesBtn.style.left = startLeft + 'px';
                yesBtn.style.top = topPos + 'px';
                
                noBtn.style.left = (startLeft + yesBtn.offsetWidth + gap) + 'px';
                noBtn.style.top = topPos + 'px';
            } else {
                const leftYes = (sandbox.clientWidth - yesBtn.offsetWidth) / 2;
                const leftNo = (sandbox.clientWidth - noBtn.offsetWidth) / 2;
                const topYes = (sandbox.clientHeight - yesBtn.offsetHeight - noBtn.offsetHeight - gap) / 2;
                
                yesBtn.style.left = leftYes + 'px';
                yesBtn.style.top = topYes + 'px';
                
                noBtn.style.left = leftNo + 'px';
                noBtn.style.top = (topYes + yesBtn.offsetHeight + gap) + 'px';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            createBackgroundSparkles();
        });

        window.addEventListener('resize', () => {
            if (attempts === 0 && document.getElementById('stepQuestion').style.display !== 'none') {
                initPositions();
            }
        });

        function hitNo() {
            noClicks++;
            if (attempts >= noPhrases.length) {
                document.getElementById('errorModal').style.display = 'flex';
            } else {
                moveButton();
            }
        }

        function closeModal() {
            document.getElementById('errorModal').style.display = 'none';
            sayYes();
        }

        function explodePremiumSparkles() {
            const bg = document.getElementById('sparklesBg');
            for(let i = 0; i < 90; i++) {
                setTimeout(() => {
                    const sparkle = document.createElement('div');
                    sparkle.classList.add('floating-sparkle');
                    sparkle.innerText = ['⚡', '🎉', '🌟', '💥', '🚀', '🎵', '✨'][Math.floor(Math.random() * 7)];
                    sparkle.style.left = (Math.random() * 86 + 7) + 'vw';
                    sparkle.style.bottom = '-30px';
                    sparkle.style.animationDuration = (Math.random() * 1.3 + 1.2) + 's';
                    sparkle.style.fontSize = (Math.random() * 28 + 18) + 'px';
                    sparkle.style.color = 'rgba(255, 215, 0, 0.6)';
                    sparkle.style.filter = 'blur(0.5px) drop-shadow(0 0 15px rgba(255, 215, 0, 0.8))';
                    bg.appendChild(sparkle);
                }, i * 15);
            }
        }

        function sayYes() {
            playSuccessMelody();
            explodePremiumSparkles();
            
            const card = document.getElementById('mainCard');
            const content = document.getElementById('cardContent');

            content.style.opacity = '0';
            content.style.transform = 'scale(0.85) rotateX(15deg)';

            setTimeout(() => {
                card.innerHTML = `
                    <div style="animation: modalPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;">
                        <div class="success-icon">✨🕺⚡</div>
                        <h1 style="font-size: 26px; margin-bottom: 0; background: linear-gradient(135deg, #ffffff, #ffd700, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                            Чудово, дякую, ${userData.name}! Готуй сукню чи костюм, буде круто! 👑
                        </h1>
                        <p style="color: #c084fc; font-size: 14px; margin-top: 35px; font-weight: 600; text-shadow: 0 0 15px rgba(168,85,247,0.5); letter-spacing: 0.5px;">
                            🚀 Відповідь надіслано!
                        </p>
                    </div>
                `;
                card.style.borderColor = '#ffd700';
                card.style.boxShadow = '0 40px 90px rgba(255, 215, 0, 0.35), 0 0 60px rgba(168, 85, 247, 0.2)';
                card.style.transform = 'translateY(-5px)';
            }, 450);

            // Оновлений відправник запиту до Web3Forms API
            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    access_key: WEB3FORMS_KEY,
                    subject: `Відповідь на вальс від ${userData.name}! 🕺`,
                    message: `📌 Нова відповідь на запрошення:\n\n` +
                             `👤 Ім'я: ${userData.name}\n` +
                             `📱 Telegram: ${userData.tg}\n` +
                             `❌ Спроб/натискань "Ні": ${noClicks}\n` +
                             `✅ Фінальне рішення: ТАК`
                })
            })
            .then(async (response) => {
                const data = await response.json();
                if (response.ok && data.success) {
                    console.log('✅ Успішно надіслано!', data);
                } else {
                    console.error('❌ Помилка Web3Forms:', data);
                }
            })
            .catch(error => {
                console.error('⚠️ Мережева помилка:', error);
            });
        }
    </script>
</body>
</html>
