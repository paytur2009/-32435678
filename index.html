<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Особливе запрошення на вальс ✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #070913;
            background-image: 
                radial-gradient(at 15% 15%, rgba(168, 85, 247, 0.22) 0px, transparent 45%),
                radial-gradient(at 85% 85%, rgba(236, 72, 153, 0.18) 0px, transparent 45%),
                radial-gradient(at 50% 50%, rgba(11, 15, 28, 1) 0px, transparent 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow-x: hidden;
            color: #f8fafc;
            padding: 16px;
        }

        html {
            height: -webkit-fill-available;
        }

        .sparkles-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            animation: pulseStar var(--duration) infinite ease-in-out alternate;
            will-change: transform, opacity;
        }

        @keyframes pulseStar {
            0% { opacity: 0.1; transform: scale(0.8); }
            100% { opacity: 0.7; transform: scale(1.3); }
        }

        .card {
            background: rgba(18, 22, 38, 0.65);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: clamp(28px, 6vw, 42px) clamp(20px, 5vw, 32px);
            border-radius: 36px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.18);
            width: 100%;
            max-width: 420px;
            z-index: 2;
            text-align: center;
            position: relative;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            background: rgba(168, 85, 247, 0.12);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 20px;
            font-size: 13px;
            color: #d8b4fe;
            font-weight: 600;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        h1 {
            font-family: 'Comfortaa', cursive;
            font-size: clamp(21px, 5.5vw, 25px);
            line-height: 1.35;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 20%, #f3e8ff 60%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 8px;
            line-height: 1.5;
        }

        .escape-counter {
            font-size: 13px;
            color: #fde047;
            margin-top: 12px;
            min-height: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .auth-form {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            position: relative;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 6px;
            margin-left: 12px;
            font-weight: 600;
        }

        .auth-form input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(11, 15, 25, 0.7);
            color: #ffffff;
            font-size: 16px; /* Запобігає авто-зуму в iOS Safari */
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .auth-form input:focus {
            border-color: #c084fc;
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.25);
            background: rgba(11, 15, 25, 0.9);
        }

        .auth-form input::placeholder {
            color: #64748b;
        }

        .auth-btn, .send-action-btn {
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            color: #ffffff;
            padding: 16px clamp(20px, 4vw, 30px);
            border-radius: 24px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.35);
            margin-top: 8px;
            transition: transform 0.2s ease, opacity 0.2s ease;
            width: 100%;
        }

        .auth-btn:disabled, .send-action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .buttons-sandbox {
            position: relative;
            width: 100%;
            height: 300px;
            margin-top: 18px;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px dashed rgba(255, 255, 255, 0.12);
            overflow: hidden;
        }

        button.option-btn {
            padding: 14px 28px;
            font-size: 15px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            position: absolute;
            white-space: nowrap;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
            transform-origin: center center;
            transition: left 0.25s cubic-bezier(0.25, 0.8, 0.25, 1), 
                        top 0.25s cubic-bezier(0.25, 0.8, 0.25, 1), 
                        transform 0.2s ease-out;
            will-change: left, top, transform;
            touch-action: manipulation;
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        #yesBtn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            z-index: 10;
            animation: softPulse 2s infinite ease-in-out;
        }

        @keyframes softPulse {
            0%, 100% { box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 12px 32px rgba(16, 185, 129, 0.7); }
        }

        #noBtn {
            background: rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 7, 15, 0.85);
            backdrop-filter: blur(16px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 32px 24px;
            border-radius: 32px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes modalPop { 
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; } 
        }
    </style>
</head>
<body>

    <div class="sparkles-bg" id="sparklesBg"></div>

    <div class="card" id="mainCard">
        <div class="card-content" id="cardContent">
            
            <div id="stepAuth">
                <span class="badge">Запрошення 💌</span>
                <h1>Привіт! 👋<br>Заповни картку для входу</h1>
                <p class="subtitle">Це займе лише секунду, щоб дізнатися деталі</p>

                <form class="auth-form" id="authForm">
                    <div class="input-group">
                        <label for="userName">Як тебе звати?</label>
                        <input type="text" id="userName" placeholder="Твоє ім'я" required autocomplete="off" maxlength="40">
                    </div>
                    <div class="input-group">
                        <label for="userTg">Твій контакт</label>
                        <input type="text" id="userTg" placeholder="Telegram (@username)" required autocomplete="off" maxlength="40">
                    </div>
                    <button type="submit" class="auth-btn" id="authBtn">Дізнатися секрет 🚀</button>
                </form>
            </div>

            <div id="stepQuestion" style="display: none;">
                <span class="badge">Запрошення на вальс 💃🕺</span>
                <h1 id="question">Будеш танцювати вальс зі мною, Максимом Звягінцевим? ✨</h1>
                <div class="escape-counter" id="escapeCounter">Тисни відповідь нижче 👇</div>
                
                <div class="buttons-sandbox" id="sandbox">
                    <button class="option-btn" id="yesBtn">Так, з радістю! 🔥</button>
                    <button class="option-btn" id="noBtn">Ні 🙈</button>
                </div>
            </div>

        </div>
    </div>

    <div class="modal" id="errorModal">
        <div class="modal-content" id="modalBox">
            <div style="font-size: 50px; margin-bottom: 10px;">🥺💔</div>
            <h3 style="color: #fde047; margin-bottom: 10px; font-size: 22px; font-family: 'Comfortaa';">Ех, шкода...</h3>
            <p style="color: #cbd5e1; font-size: 14px; margin-bottom: 22px; line-height: 1.5;">
                Але дякую за щирість! Натисни кнопку, щоб передати відповідь.
            </p>
            <button class="send-action-btn" id="sendNoBtn">Надіслати відповідь 📤</button>
        </div>
    </div>

    <script>
        const WEB3FORMS_KEY = '0a86cff4-07f0-4945-807a-b4610e623788'; 

        let userData = { name: 'Анонім', tg: 'Не вказано' };
        let noClickCount = 0;
        let noScale = 1;
        let yesScale = 1;
        let lastEscapeTime = 0;
        let isSubmitting = false;

        const noPhrases = [
            "Ей, ти куди? 🥺",
            "Подумай ще раз! 🙏",
            "Ну будь ласочка! ❤️",
            "Ти впевнена?! 😱",
            "Останній шанс! ✨"
        ];

        const noTones = [
            { bg: 'rgba(239, 68, 68, 0.35)', border: 'rgba(239, 68, 68, 0.7)' },
            { bg: 'rgba(220, 38, 38, 0.55)', border: 'rgba(220, 38, 38, 0.85)' },
            { bg: 'rgba(185, 28, 28, 0.75)', border: '#f87171' },
            { bg: 'rgba(153, 27, 27, 0.95)', border: '#fca5a5' }
        ];

        function escapeHTML(str) {
            return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        }

        function generateBackgroundStars() {
            const container = document.getElementById('sparklesBg');
            const count = 25; 
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2.5 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
                fragment.appendChild(star);
            }
            container.appendChild(fragment);
        }

        async function sendNotification(subject, message) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);

            try {
                const res = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    signal: controller.signal,
                    body: JSON.stringify({
                        access_key: WEB3FORMS_KEY,
                        subject: subject,
                        message: `👤 Ім'я: ${userData.name}\n📱 Telegram: ${userData.tg}\n\n📝 Деталі: ${message}`
                    })
                });
                clearTimeout(timeoutId);
                return res.ok;
            } catch (err) {
                console.error('Помилка відправки:', err);
                return false;
            }
        }

        function startSurvey(e) {
            e.preventDefault();
            const nameInput = document.getElementById('userName').value.trim();
            const tgInput = document.getElementById('userTg').value.trim();

            if (!nameInput || !tgInput) return;

            userData.name = nameInput;
            userData.tg = tgInput.startsWith('@') ? tgInput : '@' + tgInput;

            const cardContent = document.getElementById('cardContent');
            cardContent.style.opacity = '0';

            setTimeout(() => {
                document.getElementById('stepAuth').style.display = 'none';
                document.getElementById('stepQuestion').style.display = 'block';
                cardContent.style.opacity = '1';

                requestAnimationFrame(() => {
                    initPositions();
                });
            }, 250);
        }

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            const sandbox = document.getElementById('sandbox');
            const counterEl = document.getElementById('escapeCounter');

            counterEl.innerText = `Спроба втечі: ${noClickCount} з 5 😈`;

            const phraseIndex = Math.min(noClickCount - 1, noPhrases.length - 1);
            noBtn.innerText = noPhrases[phraseIndex];

            const toneIndex = Math.min(noClickCount - 1, noTones.length - 1);
            if (toneIndex >= 0) {
                noBtn.style.background = noTones[toneIndex].bg;
                noBtn.style.borderColor = noTones[toneIndex].border;
            }

            noScale = Math.max(0.65, noScale - 0.06);
            yesScale = Math.min(1.45, yesScale + 0.08); 

            noBtn.style.transform = `scale(${noScale})`;
            yesBtn.style.transform = `scale(${yesScale})`;

            const padding = 12; 
            const yesRect = {
                left: yesBtn.offsetLeft - (yesBtn.offsetWidth * (yesScale - 1) / 2),
                top: yesBtn.offsetTop - (yesBtn.offsetHeight * (yesScale - 1) / 2),
                width: yesBtn.offsetWidth * yesScale,
                height: yesBtn.offsetHeight * yesScale
            };

            const unscaledNoW = noBtn.offsetWidth;
            const unscaledNoH = noBtn.offsetHeight;
            const visualNoW = unscaledNoW * noScale;
            const visualNoH = unscaledNoH * noScale;

            const minX = 8;
            const maxX = sandbox.clientWidth - visualNoW - 8;
            const minY = 8;
            const maxY = sandbox.clientHeight - visualNoH - 8;

            let validX = minX;
            let validY = minY;
            let found = false;
            let attempts = 0;

            while (!found && attempts < 100) {
                attempts++;
                const candX = minX + Math.random() * Math.max(0, maxX - minX);
                const candY = minY + Math.random() * Math.max(0, maxY - minY);

                const candRect = {
                    left: candX,
                    top: candY,
                    right: candX + visualNoW,
                    bottom: candY + visualNoH
                };

                const yesRight = yesRect.left + yesRect.width;
                const yesBottom = yesRect.top + yesRect.height;

                const overlaps = !(
                    candRect.right + padding < yesRect.left ||
                    candRect.left - padding > yesRight ||
                    candRect.bottom + padding < yesRect.top ||
                    candRect.top - padding > yesBottom
                );

                if (!overlaps) {
                    validX = candX;
                    validY = candY;
                    found = true;
                }
            }

            if (!found) {
                validY = yesRect.top > sandbox.clientHeight / 2 ? 10 : sandbox.clientHeight - visualNoH - 10;
                validX = 10;
            }

            const offsetX = (unscaledNoW - visualNoW) / 2;
            const offsetY = (unscaledNoH - visualNoH) / 2;

            noBtn.style.left = (validX + offsetX) + 'px';
            noBtn.style.top = (validY + offsetY) + 'px';
        }

        function hitNo(e) {
            const now = Date.now();
            if (now - lastEscapeTime < 200) return; 
            lastEscapeTime = now;

            noClickCount++;
            if (noClickCount >= 5) {
                document.getElementById('errorModal').style.display = 'flex';
            } else {
                moveButton();
            }
        }

        function initPositions() {
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const sandbox = document.getElementById('sandbox');

            yesBtn.style.transform = 'scale(1)';
            noBtn.style.transform = 'scale(1)';

            const sandboxWidth = sandbox.clientWidth || 340;
            const yesW = yesBtn.offsetWidth || 130;
            const noW = noBtn.offsetWidth || 90;
            const gap = 14;

            const startLeft = Math.max(8, (sandboxWidth - (yesW + gap + noW)) / 2);
            const topPos = Math.max(20, (sandbox.clientHeight - 48) / 2);

            yesBtn.style.left = startLeft + 'px';
            yesBtn.style.top = topPos + 'px';

            noBtn.style.left = (startLeft + yesW + gap) + 'px';
            noBtn.style.top = topPos + 'px';
        }

        function sayYes() {
            if (typeof confetti === 'function') {
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            }

            const card = document.getElementById('mainCard');
            const content = document.getElementById('cardContent');

            content.style.opacity = '0';

            setTimeout(() => {
                const safeName = escapeHTML(userData.name);
                card.innerHTML = `
                    <div style="animation: modalPop 0.4s ease forwards;">
                        <div style="font-size: 60px; margin-bottom: 12px;">💫💖🎉</div>
                        <span class="badge">Ура! Вона сказала ТАК! ✨</span>
                        <h1 style="font-size: 22px; margin-top: 8px;">
                            Супер, ${safeName}! Я зв'яжусь з тобою зовсім скоро 😉
                        </h1>
                        <div id="yesActionContainer" style="margin-top: 20px;">
                            <button class="send-action-btn" id="submitYesBtn">Підтвердити 🚀</button>
                        </div>
                    </div>
                `;
                document.getElementById('submitYesBtn').addEventListener('click', submitYesAnswer);
            }, 250);
        }

        async function submitYesAnswer() {
            if (isSubmitting) return;
            isSubmitting = true;

            const btn = document.getElementById('submitYesBtn');
            btn.disabled = true;
            btn.innerText = 'Надсилаємо... ⏳';

            let msg = noClickCount === 0 
                ? "Погодилася танцювати вальс одразу без вагань! 🔥" 
                : `Погодилася танцювати вальс після ${noClickCount} спроб втечі! 😈`;

            const success = await sendNotification("Результат: Вона танцює ВАЛЬС! 🎉💃", msg);
            
            if (success) {
                document.getElementById('yesActionContainer').innerHTML = `
                    <p style="color: #c084fc; font-size: 15px; margin-top: 15px; font-weight: 600;">
                        ✅ Відповідь доставлено Максиму!
                    </p>
                `;
            } else {
                isSubmitting = false;
                btn.disabled = false;
                btn.innerText = 'Спробувати ще раз 🔄';
                alert('Невдалося відправити повідомлення. Перевірте зʼєднання з інтернетом та спробуйте ще раз.');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            generateBackgroundStars();

            document.getElementById('authForm').addEventListener('submit', startSurvey);
            document.getElementById('yesBtn').addEventListener('click', sayYes);

            const noBtn = document.getElementById('noBtn');
            noBtn.addEventListener('mouseenter', hitNo);
            noBtn.addEventListener('touchstart', (e) => { 
                e.preventDefault(); 
                hitNo(e); 
            }, { passive: false });

            const sendNoBtn = document.getElementById('sendNoBtn');
            sendNoBtn.addEventListener('click', async () => {
                if (isSubmitting) return;
                isSubmitting = true;

                sendNoBtn.disabled = true;
                sendNoBtn.innerText = 'Надсилання... ⏳';

                const success = await sendNotification("Результат: Фінальна відмова від вальсу 💔", `Відмова після ${noClickCount} спроб.`);
                
                if (success) {
                    document.getElementById('modalBox').innerHTML = `
                        <div style="font-size: 45px; margin-bottom: 8px;">🤝</div>
                        <h3 style="font-family: 'Comfortaa'; color: #ffffff;">Дякую за відповідь!</h3>
                        <p style="color: #94a3b8; margin-top: 8px; font-size: 14px;">Гарного тобі дня! ✨</p>
                    `;
                } else {
                    isSubmitting = false;
                    sendNoBtn.disabled = false;
                    sendNoBtn.innerText = 'Спробувати ще раз 🔄';
                    alert('Невдалося відправити повідомлення. Перевірте зʼєднання та спробуйте ще раз.');
                }
            });
        });

        window.addEventListener('resize', () => {
            if (noClickCount === 0 && document.getElementById('stepQuestion').style.display !== 'none') {
                initPositions();
            }
        });
    </script>
</body>
</html>
